[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-rule-detector"
version = "1.3.0"
description = "Malicious agent skill detection with learned local predicates and Horn rules"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.1.3", "scipy==1.18.0", "scikit-learn==1.9.0",
  "pydantic==2.13.4", "httpx>=0.28,<0.29", "threadpoolctl>=3.5,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
skill-rule = "skill_rule_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_rule_detector = ["extraction/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
